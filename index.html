<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f6fa" />
    <title>예은 가계부</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <div class="app-shell">
      <main class="app-main">
        <section class="view view-home is-active" id="home-view" aria-labelledby="home-title">
          <header class="home-hero">
            <div class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span><span></span>
            </div>
            <label class="balance-toggle">
              <span>잔액 가리기</span>
              <input type="checkbox" id="hide-balance-toggle" />
              <i aria-hidden="true"></i>
            </label>
            <div class="record-chip">
              <span aria-hidden="true">✓</span>
              <strong>오늘도 기록 완료!</strong>
            </div>
            <div class="balance-card">
              <span>총 잔액</span>
              <strong id="total-balance">0원</strong>
            </div>
          </header>

          <div class="section-header">
            <h1 id="home-title">내 계좌</h1>
            <button class="text-button" type="button" data-action="open-account-manager">관리</button>
          </div>
          <div class="account-list" id="account-list"></div>
          <button class="wide-add" type="button" data-action="open-add-account">+ 계좌 추가하기</button>
        </section>

        <section class="view view-report" id="report-view" aria-labelledby="report-title">
          <header class="top-bar">
            <button class="icon-button" type="button" data-action="prev-month" aria-label="이전 달">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" /></svg>
            </button>
            <div>
              <h1 id="report-title">월별 리포트</h1>
              <div class="month-pill">
                <button type="button" data-action="prev-month" aria-label="이전 달">‹</button>
                <strong id="report-month-label">2026-09</strong>
                <button type="button" data-action="next-month" aria-label="다음 달">›</button>
              </div>
            </div>
            <button class="icon-button" type="button" data-action="next-month" aria-label="다음 달">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
          </header>

          <div class="report-tabs" role="tablist" aria-label="리포트 필터">
            <button class="is-active" type="button" data-filter="all">전체</button>
            <button type="button" data-filter="expense">지출</button>
            <button type="button" data-filter="income">수입</button>
          </div>

          <section class="report-summary">
            <div>
              <span>지출</span>
              <strong id="month-expense">0원</strong>
            </div>
            <div>
              <span>수입</span>
              <strong id="month-income">0원</strong>
            </div>
          </section>

          <section class="compare-panel">
            <div>
              <p id="month-compare-copy">지난달과 비교할 기록이 필요해요</p>
              <button class="inline-link" type="button" data-action="show-analysis">분석 보기</button>
            </div>
            <div class="sparkline" id="spend-sparkline" aria-hidden="true"></div>
          </section>

          <section class="calendar-panel">
            <div class="weekday-row" aria-hidden="true">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
          </section>

          <section class="analysis-panel" id="analysis-panel">
            <p class="eyebrow">소비 분석</p>
            <h2 id="top-category-copy">아직 지출 기록이 없어요</h2>
            <div class="stacked-bar" id="expense-stack"></div>
            <div class="category-breakdown" id="expense-breakdown"></div>
          </section>

          <section class="analysis-panel income-analysis">
            <p class="eyebrow">수입 분석</p>
            <h2 id="top-income-copy">수입도 카테고리별로 볼 수 있어요</h2>
            <div class="stacked-bar" id="income-stack"></div>
            <div class="category-breakdown" id="income-breakdown"></div>
          </section>
        </section>

        <section class="view view-settings" id="settings-view" aria-labelledby="settings-title">
          <header class="settings-header">
            <h1 id="settings-title">설정</h1>
          </header>

          <section class="settings-card">
            <button class="settings-row" type="button" data-action="toggle-accounts">
              <span>계좌 관리</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <div class="settings-body" id="account-manager">
              <div class="manager-list" id="settings-account-list"></div>
              <form class="inline-form" id="account-form">
                <input type="text" id="account-name-input" placeholder="계좌 이름" maxlength="16" />
                <input type="number" id="account-balance-input" placeholder="현재 잔액" inputmode="numeric" />
                <button type="submit">추가</button>
              </form>
            </div>
          </section>

          <section class="settings-card">
            <button class="settings-row" type="button" data-action="toggle-categories">
              <span>카테고리 순서 관리</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
            </button>
            <div class="settings-body is-open" id="category-manager">
              <div class="segmented-control" role="tablist" aria-label="카테고리 종류">
                <button class="is-active" type="button" data-category-tab="expense">지출</button>
                <button type="button" data-category-tab="income">수입</button>
              </div>
              <div class="manager-list" id="category-list"></div>
              <form class="inline-form" id="category-form">
                <input type="text" id="category-name-input" placeholder="새 카테고리 이름" maxlength="12" />
                <button type="submit">추가</button>
              </form>
            </div>
          </section>

          <section class="settings-card">
            <button class="settings-row" type="button" data-action="reset-demo">
              <span>샘플 데이터 다시 불러오기</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6" /></svg>
            </button>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="주요 메뉴">
        <button class="is-active" type="button" data-view="home" aria-label="홈">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8" /><path d="M5 10v10h14V10" /><path d="M10 20v-6h4v6" /></svg>
        </button>
        <button type="button" data-view="report" aria-label="리포트">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18" /><path d="M21 12A9 9 0 1 1 12 3" /><path d="M12 12h9" /></svg>
        </button>
        <button type="button" data-view="settings" aria-label="설정">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" /><path d="M4 12h2m12 0h2M12 4v2m0 12v2M6.3 6.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4" /></svg>
        </button>
      </nav>

    </div>

    <div class="modal-backdrop" id="transaction-modal" aria-hidden="true">
      <section class="entry-sheet" role="dialog" aria-modal="true" aria-labelledby="entry-title">
        <button class="close-button" type="button" data-action="close-transaction" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <h2 id="entry-title">추가</h2>
        <div class="entry-meta">
          <input type="date" id="entry-date" />
          <select id="entry-account"></select>
        </div>
        <div class="amount-display" id="amount-display">- 원</div>
        <div class="entry-controls">
          <div class="segmented-control">
            <button type="button" data-entry-type="income">수입</button>
            <button class="is-active" type="button" data-entry-type="expense">지출</button>
          </div>
          <div class="category-picker">
            <span id="entry-category-question">어떤 지출인가요?</span>
            <div class="category-chips" id="entry-category-chips"></div>
          </div>
        </div>
        <input class="memo-input" type="text" id="entry-memo" placeholder="메모를 남겨도 좋아요" maxlength="40" />
        <div class="keypad" id="keypad">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="00">00</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="back" aria-label="지우기">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4H8l-6 8 6 8h13z" /><path d="m18 9-6 6M12 9l6 6" /></svg>
          </button>
        </div>
        <button class="primary-action" id="save-transaction" type="button">완료</button>
      </section>
    </div>

    <div class="modal-backdrop" id="day-modal" aria-hidden="true">
      <section class="day-sheet" role="dialog" aria-modal="true" aria-labelledby="day-title">
        <button class="close-button" type="button" data-action="close-day" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
        </button>
        <h2 id="day-title">내역</h2>
        <div id="day-transactions"></div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=4"></script>
  </body>
</html>
